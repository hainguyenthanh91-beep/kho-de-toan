name: Build Kho De Toan (Windows)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: '1.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cai thu vien
        run: python -m pip install -r requirements.txt pywebview pyinstaller
      - name: Dong goi ung dung
        run: >
          pyinstaller desktop.py --name KhoDeToan --windowed --onedir --noconfirm
          --icon icon.ico
          --add-data "app/static;app/static"
          --add-data "app/cay_mac_dinh.json;app"
          --collect-submodules uvicorn
          --collect-all webview
      - name: Cai Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Tao bo cai
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh
      - name: Ban mang di (zip)
        run: Compress-Archive -Path dist\KhoDeToan\* -DestinationPath Output\KhoDeToan_portable.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: KhoDeToan-Windows
          path: Output/*
      - name: Phat hanh (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build${{ github.run_number }}
          name: Kho Đề Toán ${{ env.APP_VERSION }} (bản ${{ github.run_number }})
          files: Output/*
          make_latest: true
